<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotel Booking System</title>
    <link rel="stylesheet" href="css/hotel.css">
</head>
<body>
    <h1>Hotel Booking System</h1>

<div class="create-user-section">
    <button class="create-user-btn" onclick="window.location.href='views/create_user.html'">
        Create User
    </button>
</div>

<div class="search-section">
    <input type="text" id="searchInput" placeholder="Search hotels...">

    <select id="locationFilter">
        <option value="">All Locations</option>
    </select>

    <select id="priceFilter">
        <option value="">All Prices</option>
        <option value="3000">Below ₹3000</option>
        <option value="4000">Below ₹4000</option>
        <option value="5000">Below ₹5000</option>
        <option value="6000">Below ₹6000</option>
        <option value="7500">Below ₹7500</option>
        <option value="10000">Below ₹10000</option>
        <option value="custom">Custom Range</option>
    </select>
</div>
    <div id="hotelContainer"></div>
    <script type="module" src="js/hotel.js"></script>
</body>
</html>
