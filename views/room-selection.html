<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Room</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/booking.css">
</head>
<body>
    <button class="back-btn"
        onclick="window.location.href='hotel-details.html?id=' + new URLSearchParams(window.location.search).get('hotelId')">
        ← Back to Hotel
    </button>
    <header>
        <h1>Select Your Room</h1>
    </header>
    <main class="container">
        <div id="hotelInfo">
            <h2>Available Rooms</h2>
        </div>
        <div class="room-filters">
            <h3>Filter Rooms</h3>
            <label for="statusFilter">
                Room Status:
            </label>
            <select id="statusFilter">
                <option value="All">All Rooms</option>
                <option value="Available">Available</option>
            </select>
            <label for="checkIn">
                Check-in:
            </label>
            <input type="date" id="checkIn">
            <label for="checkOut">
                Check-out:
            </label>
            <input type="date" id="checkOut">
            <label for="guests">
                Guests:
            </label>
            <input type="number" id="guests" min="1" placeholder="Number of guests">
            <div class="filter-buttons">
                <button type="button" id="applyFilterBtn">
                    Apply Filter
                </button>
                <button type="button" id="clearFilterBtn">
                    Clear Filter
                </button>
            </div>
        </div>
        <div id="roomContainer" class="room-container">
        </div>
        <p id="roomMessage"></p>
    </main>

    <script type="module" src="../js/room.js"></script>

</body>

</html>
